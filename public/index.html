<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link stash</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Link stash</h1>
    <form id="form" novalidate>
      <label for="url">Address</label>
      <input id="url" name="url" type="url" required autocomplete="off" aria-describedby="url-error">
      <p id="url-error" class="error" role="alert" hidden></p>
      <label for="title">Title (optional)</label>
      <input id="title" name="title" type="text" autocomplete="off">
      <label for="tags">Tags (optional, comma-separated)</label>
      <input id="tags" name="tags" type="text" autocomplete="off">
      <button id="save" type="submit">Save</button>
    </form>
    <p id="filter" class="filter" hidden>
      Showing links tagged <strong id="filter-tag"></strong>
      <button id="clear-filter" type="button" class="secondary">Clear filter</button>
    </p>
    <p id="empty" class="empty">No links saved yet</p>
    <ul id="links" hidden></ul>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
